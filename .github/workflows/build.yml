name: Build Quest Mod (.qmod)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for Beat Saber 1.40.8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ninja & Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Setup Android NDK (r26c)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Export NDK Variables
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Install QPM
        run: |
          curl -L https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-ubuntu-latest.zip -o qpm.zip
          unzip -o qpm.zip
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm
          qpm --version

      - name: Restore QPM Dependencies
        run: |
          qpm config ndk-path "${{ steps.setup-ndk.outputs.ndk-path }}"
          qpm restore

      - name: Compile Mod
        run: |
          cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE="RelWithDebInfo" -DANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          cmake --build build

      - name: Create .qmod
        run: |
          qpm qmod manifest
          zip -j EasyOffsetLegacyQuest.qmod mod.json build/libeasyoffset-legacy-quest.so

      - name: Upload .qmod File
        uses: actions/upload-artifact@v4
        with:
          name: EasyOffsetLegacyQuest_1.40.8
          path: EasyOffsetLegacyQuest.qmod
