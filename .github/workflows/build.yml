name: Build Quest Mod (.qmod)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for Beat Saber 1.40.8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ninja & Zip
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Install QPM (QuestPackageManager CLI)
        run: |
          curl -L https://github.com/QuestPackageManager/QPM.CLI/releases/latest/download/qpm-linux-x64.zip -o qpm.zip
          unzip -o qpm.zip
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm
          qpm --version

      - name: Download Android NDK & Restore Dependencies
        run: |
          qpm ndk download 26
          qpm ndk pin 26
          qpm ndk resolve -d
          qpm restore

      - name: Compile C++ Mod (.so)
        run: |
          export ANDROID_NDK_HOME=$(cat ndkpath.txt)
          cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE="RelWithDebInfo" -DANDROID_NDK="$ANDROID_NDK_HOME"
          cmake --build build

      - name: Package .qmod File
        run: |
          qpm qmod manifest
          cp build/libeasyoffset-legacy-quest.so . || true
          zip -j EasyOffsetLegacyQuest.qmod mod.json build/libeasyoffset-legacy-quest.so extern/libs/*.so

      - name: Upload .qmod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyOffsetLegacyQuest_1.40.8
          path: EasyOffsetLegacyQuest.qmod
